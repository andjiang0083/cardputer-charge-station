; ============================================================
; CHARGE STATION v0.1 — Cardputer-Adv 充电座固件
; 目标: 灭屏 + 降频 + 关射频，把 TP4057 的充电电流尽量全留给电池
; 基线: 与 ~/esp32/cyber-clock/cardputer 同一条 pioarduino espressif32 线
; ============================================================
[env:cardputer]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = dio
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
; Cardputer-Adv = Stamp-S3A = ESP32-S3FN8 -> 无 PSRAM，不能开 psram
board_build.psram = disable
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_CARDPUTER=1
monitor_speed = 115200
lib_deps =
    m5stack/M5Unified
    m5stack/M5Cardputer
